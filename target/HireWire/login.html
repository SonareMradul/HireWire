<!-- login.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet"
          href="css/style.css">
</head>


<body>

<div class="auth-page">

    <div class="auth-card">

        <h2>
            Welcome Back
        </h2>

        <form action="LoginServlet"
              method="post">

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>

    </div>

</div>

</body>


</html>
