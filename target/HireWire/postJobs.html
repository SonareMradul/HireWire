<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Job</title>
    <link rel="stylesheet"
          href="/css/style.css">
</head>
<body>

<h2>Post a Job</h2>

<form action="PostJobServlet" method="post">

    <input type="text" name="jobTitle" placeholder="Job Title" required><br><br>

    <input type="text" name="company" placeholder="Company Name" required><br><br>

    <textarea name="description" placeholder="Job Description"></textarea><br><br>

    <button type="submit">Post Job</button>

</form>

</body>
</html>
