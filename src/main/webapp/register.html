<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h2>
            Create Account
        </h2>

        <form action="RegisterServlet"
              method="post">

            <input type="text"
                   name="name"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <select name="role">

                <option value="recruiter">
                    Recruiter
                </option>

                <option value="jobseeker">
                    Job Seeker
                </option>

            </select>

            <button type="submit">
                Register
            </button>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>

</body>


</html>
