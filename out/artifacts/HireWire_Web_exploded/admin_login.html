<!DOCTYPE html>
<html >
<head>
    <title>Admin Login</title>
    <link rel="stylesheet"
          href="css/style.css">
</head>
<body>

<div class="auth-page">

    <div class="auth-card">

        <h2>
            Admin Panel
        </h2>

        <form action="AdminLoginServlet"
              method="post">

            <input type="email"
                   name="email"
                   placeholder="Admin Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Admin Password"
                   required>

            <button type="submit">
                Login as Admin
            </button>

        </form>

        <div class="auth-footer">

            Secure access for administrators only

        </div>

    </div>

</div>

</body>
</html>
